name: Weekly Pulse Scheduler

on:
  schedule:
    # Run at 9:00 AM UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: .
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest Reviews
        run: python -m src.main --step ingest

      - name: Step 2 - Analyze Themes & Quotes
        run: python -m src.main --step analyze

      - name: Step 3 - Generate Pulse
        run: python -m src.main --step generate

      - name: Step 4 - Deliver via MCP
        run: python -m src.main --step deliver
